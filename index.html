<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online van Gergő?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --kick-green: #53fc18;
      --kick-dark: #0b0e0f;
      --card-bg: rgba(20, 25, 28, 0.85);
      --card-border: #242d32;
      --red-alert: #ff3b30;
      --text-main: #f0f4f8;
      --text-sub: #8a99a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--kick-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(145, 70, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(83, 252, 24, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
      transition: all 0.4s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .status-card {
      border-radius: 18px;
      padding: 30px 20px;
      margin-bottom: 20px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid transparent;
    }

    .status-card.offline {
      background: rgba(255, 59, 48, 0.08);
      border-color: rgba(255, 59, 48, 0.3);
    }

    .status-card.online {
      background: rgba(83, 252, 24, 0.1);
      border-color: var(--kick-green);
      box-shadow: 0 0 30px rgba(83, 252, 24, 0.25);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .offline .badge {
      background: rgba(255, 59, 48, 0.2);
      color: var(--red-alert);
    }

    .online .badge {
      background: var(--kick-green);
      color: #000;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .online .dot {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    .status-title {
      font-size: 2.3rem;
      font-weight: 900;
      margin-bottom: 10px;
      line-height: 1.1;
    }

    .status-desc {
      font-size: 1.1rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .stream-container {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .stream-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      width: 100%;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      background: var(--kick-green);
      color: #000;
      margin-bottom: 20px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(83, 252, 24, 0.4);
    }

    .quote-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 16px;
      font-style: italic;
      color: #a0aec0;
      font-size: 0.95rem;
      border-left: 3px solid var(--kick-green);
      text-align: left;
    }

    .channel-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 20px;
    }

    .channel-info span {
      color: var(--kick-green);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Vajon Gergő épp Reni streamjét nézi?</h1>

    <div class="status-card offline" id="statusCard">
      <div class="badge" id="statusBadge">
        <div class="dot"></div>
        <span id="badgeText">ELLENŐRZÉS...</span>
      </div>
      <div class="status-title" id="statusTitle">Mérés folyamatban...</div>
      <div class="status-desc" id="statusDesc">Villámgyors lekérdezés a Kick API-ból...</div>
    </div>

    <div class="stream-container" id="streamBox">
      <iframe id="kickFrame" src="" allowfullscreen="true"></iframe>
    </div>

    <a href="https://kick.com/renipuff" target="_blank" class="btn" id="kickLink">
      📺 ReniPuff Kick Csatornája
    </a>

    <div class="quote-box" id="quoteBox">
      "Keresem a jelet... ha Reni elindul, Gergő gépének ventilátorai felpörögnek."
    </div>

    <div class="channel-info">
      Megfigyelt csatorna: <span id="watchedChannel">renipuff</span>
    </div>
  </div>

  <script>
    const TARGET_CHANNEL = "renipuff"; 

    const OFFLINE_QUOTES = [
      "😴 Gergő jelenleg tanul / alszik / értelmes életet él. (Reni offline)",
      "🥤 Reni még bekészíti a szörpöt, Gergő pedig türelmetlenül pattog a székében.",
      "📉 Nulla stream, nulla akció. Gergő épp próbál úgy tenni, mintha hasznos dolgot csinálna.",
      "⏳ Csend a vihar előtt... a billentyűzet még nem izzik Reni miatt.",
      "💤 Valószínűleg még senki sem indította be a gépet. Pihenőidő!"
    ];

    const ONLINE_QUOTES = [
      "🔥 RIADÓ! Reni elindította a streamet! Gergő már a chaten pörög!",
      "🚀 RIADÓ! Beindult a műsor, Gergő 0.01 másodperc alatt beköszönt!",
      "🎮 Megy a stream! A Discord üres, mert mindenki Reni Kick-jét nézi!",
      "⚡ Élesedett a közvetítés! Gergő gépének ventilátorai felpörögtek!",
      "🍿 Popcorn bekészítve, Gergő már az első sorból figyeli Renit!"
    ];

    let wasOnline = false;

    const statusCard = document.getElementById('statusCard');
    const badgeText = document.getElementById('badgeText');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const quoteBox = document.getElementById('quoteBox');
    const kickLink = document.getElementById('kickLink');
    const watchedChannelElem = document.getElementById('watchedChannel');
    const streamBox = document.getElementById('streamBox');
    const kickFrame = document.getElementById('kickFrame');

    watchedChannelElem.textContent = TARGET_CHANNEL;
    kickLink.href = `https://kick.com/${TARGET_CHANNEL}`;

    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'online') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch(e) {}
    }

    function updateUI(isLive) {
      if (isLive) {
        statusCard.className = "status-card online";
        badgeText.textContent = "ONLINE!";
        statusTitle.textContent = "IGEN, ONLINE!";
        statusDesc.textContent = `${TARGET_CHANNEL} épp streamel! Gergő garantáltan nézi!`;
        quoteBox.textContent = ONLINE_QUOTES[Math.floor(Math.random() * ONLINE_QUOTES.length)];
        streamBox.style.display = "block";

        if (!wasOnline) {
          kickFrame.src = `https://player.kick.com/${TARGET_CHANNEL}`;
          playSound('online');
          if (typeof confetti === 'function') {
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          }
          wasOnline = true;
        }
      } else {
        statusCard.className = "status-card offline";
        badgeText.textContent = "OFFLINE";
        statusTitle.textContent = "NEM, OFFLINE";
        statusDesc.textContent = `${TARGET_CHANNEL} nem streamel. Gergő gyanúsan tétlen.`;
        quoteBox.textContent = OFFLINE_QUOTES[Math.floor(Math.random() * OFFLINE_QUOTES.length)];
        streamBox.style.display = "none";
        kickFrame.src = "";
        
        if (wasOnline) {
          playSound('offline');
          wasOnline = false;
        }
      }
    }

    async function checkKickStatus() {
      try {
        const timestamp = new Date().getTime();
        const targetUrl = `https://kick.com/api/v1/channels/${TARGET_CHANNEL}`;
        
        const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}&_cb=${timestamp}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error("API hiba");

        const channelData = await response.json();

        const isLive = channelData.livestream !== null && channelData.livestream !== undefined;
        updateUI(isLive);

      } catch (err) {
        try {
          const timestamp = new Date().getTime();
          const targetUrl = `https://kick.com/api/v1/channels/${TARGET_CHANNEL}`;
          const fallbackUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&cb=${timestamp}`;
          
          const response = await fetch(fallbackUrl);
          const data = await response.json();
          const channelData = JSON.parse(data.contents);
          
          const isLive = channelData.livestream !== null && channelData.livestream !== undefined;
          updateUI(isLive);
        } catch (fallbackErr) {
          console.warn("API lekérdezési hiba:", fallbackErr);
          updateUI(false);
        }
      }
    }

    checkKickStatus();
    setInterval(checkKickStatus, 15000);
  </script>
</body>
</html>
